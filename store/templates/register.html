{% extends 'layout.html' %}
{% load humanize %}
{% load static %}

{{ product.price|floatformat:0|intcomma }}₮
{% block content %}

<header class="bg-dark-py-5">
    <div class="container px-4 px-lg-5 my-5">
        <div class="text-center text-white">
            <h1 class="display-4 fw-bolder">{{ T.register_title }}</h1>
            <p class="lead fw-normal text-white-50 mb-0">{{ T.register_subtitle }}</p>
        </div>
    </div>
</header>
<div class="container">
    <div class="row">
        <div class="col-md-6 offset-md-3">   
            <br>
            <form action="{% url 'register' %}" method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <br><br>
                <button type="submit" class="btn btn-primary">{{ T.register_btn }}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
