{% extends 'layout.html' %}
{% load humanize %}
{% load static %}

{{ product.price|floatformat:0|intcomma }}₮

{% block content %}

<header class="bg-dark-py-5">
    <div class="container px-4 px-lg-5 my-5">
        <div class="text-center text-white">
            <h1 class="display-4 fw-bolder">{{ T.login_title }}</h1>
            <p class="lead fw-normal text-white-50 mb-0">{{ T.login_subtitle }}</p>
        </div>
    </div>
</header>
<div class="container">
    <div class="row">
        <div class="col-md-6 offset-md-3">   
            <br>
            <form action="{% url 'login' %}" method="POST">
                {% csrf_token %}

                <div class="mb-3">
                  <label for="username" class="form-label">{{ T.username_label }}</label>
                  <input type="text" class="form-control" name="username" aria-describedby="usernameHelp">
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">{{ T.password_label }}</label>
                  <input type="password" class="form-control" name="password">
                </div>
                </div>
                <button type="submit" class="btn btn-secondary">{{ T.login_btn }}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
