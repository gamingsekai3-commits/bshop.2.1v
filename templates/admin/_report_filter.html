<form method="get" class="report-filter" id="report-filter-form">
  <div class="dp">
    <label for="date_from">{{ T.admin_report_from }}</label>
    <input type="text" readonly autocomplete="off" id="date_from" name="date_from" value="{{ date_from }}">
  </div>
  <div class="dp">
    <label for="date_to">{{ T.admin_report_to }}</label>
    <input type="text" readonly autocomplete="off" id="date_to" name="date_to" value="{{ date_to }}">
  </div>
</form>
